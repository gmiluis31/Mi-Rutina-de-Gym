<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi rutina de gym</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F1ED;--card:#FFFFFF;--ink:#1B1D21;--mute:#6B6E75;--line:#DDDBD4;--acc:#2B50F0;--accink:#fff;--ok:#E8B931;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171A;--card:#1E2125;--ink:#ECEBE6;--mute:#9A9DA4;--line:#2E3238;--acc:#6F8BFF;--accink:#10131A;--ok:#E8B931}}
:root[data-theme="dark"]{--bg:#15171A;--card:#1E2125;--ink:#ECEBE6;--mute:#9A9DA4;--line:#2E3238;--acc:#6F8BFF;--accink:#10131A;--ok:#E8B931}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
button{touch-action:manipulation}
.layout{display:block}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;margin:0;letter-spacing:.01em}
h1{font-size:clamp(28px,7vw,40px);line-height:1}
h2{font-size:28px}
header{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.sub{color:var(--mute);font-size:14px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.ico{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:50%}.ico svg{width:22px;height:22px}
.mes{display:flex;align-items:center;gap:8px}.mtxt{flex:1;min-width:0}.mtxt h2{font-size:30px;line-height:1}.mes .ico{flex:none;font-size:24px}
.semanas{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:4px}
.sem{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;text-align:center;line-height:1.15}
.sem small{display:block;font-size:11px;color:var(--mute);font-weight:500}
.sem[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}.sem[aria-pressed="true"] small{color:var(--accink);opacity:.85}
.day .dn{display:block;font-size:.8em;opacity:.8}.day .dd{display:block;font-size:1.15em;line-height:1.1}.day.out{opacity:.45}
.day.hoy:not([aria-pressed="true"]){border-color:var(--acc);color:var(--acc)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.day{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 0 6px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;position:relative}
.day small{display:block;font:500 11px Barlow,sans-serif;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:clip;padding:0 2px;min-height:14px}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.day i{position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px;background:var(--ok);transform-origin:left;transform:scaleX(var(--p,0))}
.focusrow{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.focusrow select{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 16px}
.bar b{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.ex{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ex.done{border-color:var(--ok)}
.exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exname{font-weight:600;font-size:18px}
.meta{color:var(--mute);font-size:14px}
.x{border:0;background:none;color:var(--mute);font-size:22px;line-height:1;padding:2px 6px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.set{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:transparent;font:700 18px "Barlow Condensed",sans-serif}
.set[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#1B1D21}
.xs{display:flex;gap:2px}.ef .f{grid-template-columns:repeat(3,1fr)}.ef .row{display:flex;gap:8px;margin-top:12px}.ef .row .btn{flex:1;padding:10px}
.ficha{margin-top:10px}.dib{width:100%;max-width:440px;margin:0 auto 8px;background:var(--bg);border-radius:12px;padding:6px;color:var(--ink)}.dib svg{display:block;width:100%;height:auto}
.eq,.tip{margin:4px 0 0;font-size:14px;line-height:1.35}.eq{color:var(--ink)}.tip{color:var(--mute)}
.hb{display:flex;gap:8px}
select{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:3px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}.ov[hidden]{display:none}
.hoja{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
@media (min-width:600px){.ov{align-items:center}.hoja{border-radius:18px}}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.c2{grid-column:1/-1}
.perr{color:#D6453D;font-size:14px;min-height:20px;margin:8px 0 0}
.prow{display:flex;gap:8px;margin-top:8px}.prow .btn{flex:1;padding:11px}
.sec{margin-top:18px}.sec h3{font:700 22px "Barlow Condensed",sans-serif;margin:0 0 2px}
.gr{background:var(--bg);border-radius:12px;padding:8px;margin-top:8px}.gr svg{display:block;width:100%;height:auto}
.tb{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.tb th,.tb td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}.tb th{color:var(--mute);font-weight:500}
.reg{display:flex;gap:8px;margin-top:10px}.reg input{flex:1;margin-top:0}.reg .btn{flex:none;padding:9px 14px}
.lbl{display:block;font-size:13px;color:var(--mute)}.rb{grid-column:1/-1}
@media (min-width:480px){.rb{grid-column:auto}}
.rueda{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;height:160px;margin-top:3px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.col{height:160px;width:64px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:60px 0;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y;-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.col::-webkit-scrollbar{display:none}
.it{height:40px;line-height:40px;text-align:center;scroll-snap-align:center;font:600 20px "Barlow Condensed",sans-serif;color:var(--mute);cursor:pointer}
.it.on{color:var(--ink);font-size:30px}
.banda{position:absolute;left:8px;right:8px;top:60px;height:40px;border-top:2px solid var(--acc);border-bottom:2px solid var(--acc);pointer-events:none}
.sep,.un{font:700 22px "Barlow Condensed",sans-serif}.un{color:var(--mute);font-size:18px}
.btn:disabled{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:90%;text-align:center}.toast[hidden]{display:none}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--mute);margin-bottom:10px}
form{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
form h3{margin:0 0 10px;font:700 20px "Barlow Condensed",sans-serif}
.f{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
label{display:block;font-size:13px;color:var(--mute)}
input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:3px}
.full{width:100%;margin-top:12px;padding:11px}
.tpl{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tpl .sub{width:100%}
.aviso{width:100%;border:1.5px solid var(--ok);border-radius:12px;padding:12px;background:var(--card)}.aviso[hidden]{display:none}.aviso p{margin:0 0 10px;font-weight:600}.aviso .row{display:flex;gap:8px}.aviso .btn{flex:1}
@media (max-width:380px){
  main{padding-top:12px}
  .week{gap:4px}.day{font-size:16px;border-radius:8px}.day small{font-size:9.5px}
  .set{width:42px;height:42px}.exname{font-size:17px}.f{gap:6px}
}
@media (min-width:600px){
  .day{padding:12px 0 10px;font-size:22px}.day small{font-size:12px}
  .week{gap:10px}
}
@media (min-width:860px){
  main{max-width:1040px;padding-top:28px}
  .week{margin-bottom:24px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
  aside{position:sticky;top:20px}
  aside form{margin-top:0}
  .set{width:50px;height:50px}
}
@media (prefers-reduced-motion:reduce){.bar b{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Mi rutina</h1><div class="sub" id="resumen"></div><div class="sub" id="pres"></div></div>
    <div class="hb"><button class="btn ico" id="evoBtn" aria-label="Ver mi evolución"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-7"/></svg></button><button class="btn ico" id="cfg" aria-label="Configuración y datos personales"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button><button class="btn ico" id="tema" aria-label="Cambiar a tema oscuro"></button></div>
  </header>

  <div class="mes">
    <button class="btn ico" id="mprev" aria-label="Mes anterior">‹</button>
    <div class="mtxt"><h2 id="mes"></h2><div class="sub" id="mresumen"></div></div>
    <button class="btn" id="mhoy">Hoy</button>
    <button class="btn ico" id="mnext" aria-label="Mes siguiente">›</button>
  </div>
  <div class="bar" aria-hidden="true"><b id="mprog"></b></div>
  <div class="semanas" id="semanas" role="group" aria-label="Semanas del mes"></div>
  <div class="week" id="semana" role="group" aria-label="Días de la semana"></div>

  <div class="layout">
  <section class="dia" aria-label="Rutina del día">
  <div class="focusrow">
    <h2 id="titulo"></h2>
  </div>
  <div class="focusrow">
    <select id="foco" aria-label="Enfoque del día"></select>
    <button class="btn" id="reset" title="Borrar todos los ejercicios y series de este día">Reiniciar día</button>
  </div>
  <div class="bar" aria-hidden="true"><b id="prog"></b></div>

  <div id="lista"></div>

  </section>
  <aside>
  <form id="nuevo">
    <h3>Añadir ejercicio</h3>
    <label>Nombre
      <input id="n" list="biblio" required placeholder="Ej. Press de banca" autocomplete="off">
    </label>
    <datalist id="biblio"></datalist>
    <div class="f">
      <label>Series<input id="s" type="number" min="1" max="12" value="3" required></label>
      <label>Reps<input id="r" type="number" min="1" max="100" value="10" required></label>
      <label>Peso (kg)<input id="k" type="number" min="0" step="0.5" value="0"></label>
    </div>
    <button class="btn pri full" type="submit">Añadir al día</button>
  </form>

  <div class="tpl">
    <div class="sub">Empezar desde una plantilla (reemplaza la semana)</div>
    <button class="btn" data-t="ppl">Push / Pull / Pierna</button>
    <button class="btn" data-t="tp">Torso / Pierna</button>
    <button class="btn" data-t="fb">Cuerpo completo</button>
    <button class="btn" data-t="vacio">Vaciar semana</button>
    <div class="aviso" id="aviso" hidden role="alertdialog" aria-live="assertive">
      <p id="avtxt"></p>
      <div class="row"><button class="btn" data-no>Cancelar</button><button class="btn pri" data-ok>Sí, continuar</button></div>
    </div>
  </div>
  </aside>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="ov" id="evo" hidden role="dialog" aria-modal="true" aria-labelledby="etit">
  <div class="hoja">
    <div class="exhead"><h2 id="etit">Mi evolución</h2><button class="btn" id="ecerrar">Cerrar</button></div>
    <div id="evoc"></div>
  </div>
</div>
<div class="ov" id="perfil" hidden role="dialog" aria-modal="true" aria-labelledby="ptitulo">
  <form class="hoja" id="pform" style="margin:0;border:0">
    <h2 id="ptitulo"></h2>
    <div class="sub" id="psub"></div>
    <div class="pg">
      <label class="c2">Nombre (opcional)<input id="pn" maxlength="30" autocomplete="given-name"></label>
      <label>Edad (años)<input id="pe" type="number" inputmode="numeric" min="10" max="100" required></label>
      <label>Nivel<select id="pv"></select></label>
      <div class="rb"><span class="lbl">Peso (desliza)</span><div id="rpw"></div></div>
      <div class="rb"><span class="lbl">Altura (desliza)</span><div class="rueda" id="ra"><div class="rc"></div><span class="un">cm</span><i class="banda"></i></div></div>
      <label class="c2">Objetivo<select id="po"></select></label>
    </div>
    <p class="perr" id="perr" role="alert"></p>
    <div class="prow"><button type="button" class="btn" id="pno"></button><button type="submit" class="btn pri">Guardar</button></div>
  </form>
</div>

<script>
const DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const NOMBRES=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const FOCOS=["Sin definir","Descanso","Pecho","Espalda","Hombros","Brazos","Pierna","Push","Pull","Torso","Cuerpo completo","Cardio"];
const BIBLIO=["Press de banca","Press inclinado con mancuernas","Fondos","Aperturas","Dominadas","Remo con barra","Jalón al pecho","Remo con mancuerna","Press militar","Elevaciones laterales","Curl de bíceps","Extensión de tríceps","Sentadilla","Peso muerto rumano","Prensa","Zancadas","Curl femoral","Elevación de talones","Plancha","Hip thrust"];
const E=(n,s,r,k=0)=>({n,s,r,k});
const PUSH=[E("Press de banca",4,8),E("Press inclinado con mancuernas",3,10),E("Press militar",3,10),E("Elevaciones laterales",3,15),E("Extensión de tríceps",3,12)];
const PULL=[E("Dominadas",4,8),E("Remo con barra",4,8),E("Jalón al pecho",3,12),E("Curl de bíceps",3,12)];
const LEG=[E("Sentadilla",4,8),E("Peso muerto rumano",3,10),E("Prensa",3,12),E("Curl femoral",3,12),E("Elevación de talones",4,15)];
const TORSO=[E("Press de banca",4,8),E("Remo con barra",4,8),E("Press militar",3,10),E("Jalón al pecho",3,12),E("Curl de bíceps",2,12),E("Extensión de tríceps",2,12)];
const FULL=[E("Sentadilla",3,8),E("Press de banca",3,8),E("Remo con mancuerna",3,10),E("Press militar",3,10),E("Plancha",3,1)];
const PLANTILLAS={
 ppl:[["Push",PUSH],["Pull",PULL],["Pierna",LEG],["Descanso",[]],["Push",PUSH],["Pull",PULL],["Descanso",[]]],
 tp:[["Torso",TORSO],["Pierna",LEG],["Descanso",[]],["Torso",TORSO],["Pierna",LEG],["Descanso",[]],["Descanso",[]]],
 fb:[["Cuerpo completo",FULL],["Descanso",[]],["Cuerpo completo",FULL],["Descanso",[]],["Cuerpo completo",FULL],["Descanso",[]],["Descanso",[]]],
 vacio:[0,1,2,3,4,5,6].map(()=>["Sin definir",[]])
};
const KEY="rutina-gym-v1";
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
let id=0; const uid=()=>Date.now().toString(36)+(id++);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=t=>{const [y,m,d]=t.split("-").map(Number);return new Date(y,m-1,d)};
const wd=d=>(d.getDay()+6)%7;
const hoyD=new Date(), hoyIso=iso(hoyD);
let sel=hoyIso, editId=null, pend=null;
let st={dias:DIAS.map(()=>({foco:"Sin definir",ex:[]})),log:{},perfil:null,perfilVisto:false,pesos:{},hist:{}};
try{const g=JSON.parse(localStorage.getItem(KEY)||"null");if(g&&g.dias&&g.dias.length===7){st.dias=g.dias;st.log=g.log||{};st.perfil=g.perfil||null;st.perfilVisto=!!g.perfilVisto;st.pesos=g.pesos||{};st.hist=g.hist||{};}}catch(e){}
const guardar=()=>{try{localStorage.setItem(KEY,JSON.stringify({dias:st.dias,log:st.log,perfil:st.perfil,perfilVisto:st.perfilVisto,pesos:st.pesos,hist:st.hist}))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const planDe=k=>st.dias[wd(parse(k))];
const marks=(k,e)=>{const a=(st.log[k]||{})[e.id]||[];return Array.from({length:e.s},(_,i)=>!!a[i])};
const progD=k=>{const p=planDe(k);const t=p.ex.reduce((a,e)=>a+e.s,0);if(!t)return 0;return p.ex.reduce((a,e)=>a+marks(k,e).filter(Boolean).length,0)/t};
const dias7=s=>Array.from({length:7},(_,k)=>new Date(s.getFullYear(),s.getMonth(),s.getDate()+k));
function semanasDe(y,m){
  const prim=new Date(y,m,1),ult=new Date(y,m+1,0);
  let ini=new Date(y,m,1-wd(prim));const r=[];
  while(ini<=ult){r.push(ini);ini=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+7)}
  return r;
}
function pintar(){
  const sd=parse(sel),y=sd.getFullYear(),m=sd.getMonth(),k=wd(sd);
  const dim=new Date(y,m+1,0).getDate();
  const sems=semanasDe(y,m);
  const wi=sems.findIndex(w=>dias7(w).some(x=>iso(x)===sel));
  $("#mes").textContent=MESES[m][0].toUpperCase()+MESES[m].slice(1)+" "+y;
  let plan=0,hechos=0;
  for(let d=1;d<=dim;d++){const q=iso(new Date(y,m,d));if(planDe(q).ex.length){plan++;if(progD(q)>=1)hechos++}}
  $("#mresumen").textContent=plan?`${hechos} de ${plan} entrenamientos completados`:"Aún no tienes días planificados";
  $("#mprog").style.width=plan?Math.round(hechos/plan*100)+"%":"0%";
  $("#semanas").innerHTML=sems.map((w,i)=>{
    const dd=dias7(w).filter(x=>x.getMonth()===m);
    return `<button class="sem" data-w="${i}" aria-pressed="${i===wi}">Sem ${i+1}<small>${dd[0].getDate()}–${dd[dd.length-1].getDate()}</small></button>`;
  }).join("");
  $("#semana").innerHTML=dias7(sems[wi]).map((d,j)=>{
    const q=iso(d),p=planDe(q),f=p.foco==="Sin definir"?"":p.foco;
    return `<button class="day${d.getMonth()!==m?" out":""}${q===hoyIso?" hoy":""}" data-d="${q}" aria-pressed="${q===sel}" aria-label="${NOMBRES[j]} ${d.getDate()}${f?", "+f:""}"><span class="dn">${DIAS[j]}</span><span class="dd">${d.getDate()}</span><small>${esc(f)}</small><i style="--p:${progD(q)}"></i></button>`;
  }).join("");
  const dia=planDe(sel);
  $("#titulo").textContent=`${NOMBRES[k]} ${sd.getDate()}`+(sel===hoyIso?" · hoy":"");
  $("#foco").innerHTML=FOCOS.map(f=>`<option ${f===dia.foco?"selected":""}>${f}</option>`).join("");
  $("#prog").style.width=Math.round(progD(sel)*100)+"%";
  const L=$("#lista");
  if(!dia.ex.length){
    L.innerHTML=`<div class="empty">${dia.foco==="Descanso"?"Día de descanso. Recupera bien.":"Aún no hay ejercicios este día. Añade uno abajo o carga una plantilla."}</div>`;
  } else {
    L.innerHTML=dia.ex.map(e=>{
      if(e.id===editId)return `<form class="ex ef" data-edit="${e.id}">
        <label>Nombre<input name="n" list="biblio" required value="${esc(e.n)}" autocomplete="off"></label>
        <div class="f">
          <label>Series<input name="s" type="number" min="1" max="12" required value="${e.s}"></label>
          <label>Reps<input name="r" type="number" min="1" max="100" required value="${e.r}"></label>
          <label>Peso (kg)<input name="k" type="number" min="0" step="0.5" value="${e.k}"></label>
        </div>
        <div class="row"><button type="button" class="btn" data-cancel>Cancelar</button><button type="submit" class="btn pri">Guardar</button></div>
      </form>`;
      const mk=marks(sel,e),fin=mk.every(Boolean);
      return `<div class="ex ${fin?"done":""}" data-id="${e.id}">
        <div class="exhead"><div><div class="exname">${esc(e.n)}</div><div class="meta">${e.s} × ${e.r}${e.k?` · ${e.k} kg`:""}</div></div>
        <div class="xs"><button class="x" data-edit-btn="${e.id}" aria-label="Editar ${esc(e.n)}">✎</button><button class="x" data-del="${e.id}" aria-label="Quitar ${esc(e.n)}">×</button></div></div>
        <div class="sets">${mk.map((v,j)=>`<button class="set" data-id="${e.id}" data-j="${j}" aria-pressed="${v}" aria-label="Serie ${j+1} de ${e.s}">${j+1}</button>`).join("")}</div>
      </div>`;
    }).join("");
  }
  const tot=st.dias.filter(d=>d.ex.length).length;
  $("#resumen").textContent=tot?`${tot} ${tot===1?"día planificado":"días planificados"} por semana`:"Planifica tu semana de entrenamiento";
  if(resetT&&resetDia!==sel)cancelReset();
  $("#reset").disabled=!dia.ex.length;
  $("#reset").title=dia.ex.length?"Borrar todos los ejercicios y series de este día":"Este día no tiene ejercicios";
  const pf=st.perfil;
  if(pf){const im=pf.altura?(pf.peso/Math.pow(pf.altura/100,2)).toFixed(1).replace(".",","):"";
    $("#pres").textContent=[pf.nombre,pf.edad+" años",pf.peso+" kg",pf.altura?pf.altura+" cm":"",im?"IMC "+im:""].filter(Boolean).join(" · ");}
  else $("#pres").textContent="";
  guardar();
}
function irMes(dm){
  const sd=parse(sel),n=new Date(sd.getFullYear(),sd.getMonth()+dm,1);
  const h=hoyD.getFullYear()===n.getFullYear()&&hoyD.getMonth()===n.getMonth();
  sel=h?hoyIso:iso(n);editId=null;pintar();
}
$("#mprev").addEventListener("click",()=>irMes(-1));
$("#mnext").addEventListener("click",()=>irMes(1));
$("#mhoy").addEventListener("click",()=>{sel=hoyIso;editId=null;pintar()});
$("#semanas").addEventListener("click",e=>{
  const b=e.target.closest("[data-w]");if(!b)return;
  const sd=parse(sel),sems=semanasDe(sd.getFullYear(),sd.getMonth());
  const dd=dias7(sems[+b.dataset.w]).filter(x=>x.getMonth()===sd.getMonth());
  sel=iso(dd.find(x=>iso(x)===hoyIso)||dd[0]);editId=null;pintar();
});
$("#semana").addEventListener("click",e=>{const b=e.target.closest(".day");if(b){sel=b.dataset.d;editId=null;pintar()}});
$("#foco").addEventListener("change",e=>{planDe(sel).foco=e.target.value;pintar()});
function avisar(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>{t.hidden=true},2400)}
let resetT=null,resetDia=null;
function cancelReset(){clearTimeout(resetT);resetT=null;resetDia=null;const b=$("#reset");b.textContent="Reiniciar día";b.classList.remove("pri")}
$("#reset").addEventListener("click",()=>{
  const b=$("#reset");if(b.disabled)return;
  if(!resetT){resetDia=sel;b.textContent="¿Seguro? Toca de nuevo";b.classList.add("pri");resetT=setTimeout(cancelReset,4000);return}
  cancelReset();
  const dia=planDe(sel);dia.ex=[];dia.foco="Sin definir";
  delete st.log[sel];delete st.hist[sel];editId=null;pintar();
  avisar("Día reiniciado: ejercicios y series borrados");
});
$("#lista").addEventListener("click",e=>{
  const dia=planDe(sel);
  const ed=e.target.closest("[data-edit-btn]");
  if(ed){editId=ed.dataset.editBtn;pintar();const i=document.querySelector(".ef input");if(i)i.focus();return}
  if(e.target.closest("[data-cancel]")){editId=null;pintar();return}
  const del=e.target.closest("[data-del]");
  if(del){dia.ex=dia.ex.filter(x=>x.id!==del.dataset.del);pintar();return}
  const b=e.target.closest(".set");
  if(b){const x=dia.ex.find(x=>x.id===b.dataset.id);const a=marks(sel,x);a[+b.dataset.j]=!a[+b.dataset.j];(st.log[sel]=st.log[sel]||{})[x.id]=a;snap(sel,x);pintar()}
});
$("#lista").addEventListener("submit",e=>{
  const f=e.target.closest("[data-edit]");if(!f)return;
  e.preventDefault();
  const x=planDe(sel).ex.find(x=>x.id===f.dataset.edit);if(!x)return;
  const n=f.n.value.trim();if(!n)return;
  x.n=n;x.s=Math.max(1,Math.min(12,+f.s.value||x.s));x.r=+f.r.value||x.r;x.k=+f.k.value||0;snap(sel,x);
  editId=null;pintar();
});
$("#nuevo").addEventListener("submit",e=>{
  e.preventDefault();
  const n=$("#n").value.trim();if(!n)return;
  const dia=planDe(sel);
  dia.ex.push({id:uid(),n,s:Math.max(1,Math.min(12,+$("#s").value||3)),r:+$("#r").value||10,k:+$("#k").value||0});
  if(dia.foco==="Sin definir")dia.foco="Cuerpo completo";
  $("#n").value="";pintar();
});
function aplicar(t){
  st.dias=PLANTILLAS[t].map(([foco,ex])=>({foco,ex:ex.map(x=>({id:uid(),n:x.n,s:x.s,r:x.r,k:x.k}))}));
  editId=null;pintar();
}
document.querySelector(".tpl").addEventListener("click",e=>{
  const c=e.target.closest("[data-ok],[data-no]");
  if(c){if(c.hasAttribute("data-ok")&&pend)aplicar(pend);pend=null;$("#aviso").hidden=true;return}
  const b=e.target.closest("[data-t]");if(!b)return;
  const t=b.dataset.t;
  if(st.dias.some(d=>d.ex.length||d.foco!=="Sin definir")){
    pend=t;
    $("#avtxt").textContent=t==="vacio"?"¿Vaciar toda la rutina semanal? Se borrarán los ejercicios y el progreso marcado de ellos.":"Esto reemplazará tu rutina semanal y el progreso marcado de sus ejercicios. ¿Continuar?";
    $("#aviso").hidden=false;$("#aviso").scrollIntoView({block:"nearest"});
  } else aplicar(t);
});
const SOL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const LUNA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const temaActual=()=>document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function pintarTema(){
  const oscuro=temaActual()==="dark";
  $("#tema").innerHTML=oscuro?SOL:LUNA;
  $("#tema").setAttribute("aria-label",oscuro?"Cambiar a tema claro":"Cambiar a tema oscuro");
}
try{const t=localStorage.getItem(KEY+"-tema");if(t)document.documentElement.dataset.theme=t;}catch(e){}
$("#tema").addEventListener("click",()=>{
  const n=temaActual()==="dark"?"light":"dark";
  document.documentElement.dataset.theme=n;
  try{localStorage.setItem(KEY+"-tema",n)}catch(e){}
  pintarTema();
});
pintarTema();
$("#biblio").innerHTML=BIBLIO.map(b=>`<option value="${b}">`).join("");
const OBJ=["Ganar músculo","Perder grasa","Mantenerme","Mejorar resistencia"],NIV=["Principiante","Intermedio","Avanzado"];
$("#po").innerHTML=OBJ.map(o=>`<option>${o}</option>`).join("");
$("#pv").innerHTML=NIV.map(o=>`<option>${o}</option>`).join("");
let modoCfg=false;
function abrirPerfil(cfg){
  modoCfg=cfg;const p=st.perfil||{};
  $("#ptitulo").textContent=cfg?"Configuración":"Cuéntanos sobre ti";
  $("#psub").textContent=cfg?"Edita tus datos cuando quieras. Se guardan solo en este dispositivo.":"Estos datos se guardan solo en tu dispositivo y puedes cambiarlos luego en configuración.";
  $("#pn").value=p.nombre||"";$("#pe").value=p.edad||"";
  $("#po").value=p.objetivo||OBJ[0];$("#pv").value=p.nivel||NIV[0];
  $("#pno").textContent=cfg?"Cancelar":"Omitir por ahora";
  $("#perr").textContent="";$("#perfil").hidden=false;setPeso("rp",p.peso||70);ponerCol($("#ra .rc"),p.altura||170);$("#pn").focus();
}
function cerrarPerfil(){if(!modoCfg){st.perfilVisto=true;guardar()}$("#perfil").hidden=true}
$("#cfg").addEventListener("click",()=>abrirPerfil(true));
$("#pno").addEventListener("click",cerrarPerfil);
$("#perfil").addEventListener("click",e=>{if(e.target.id==="perfil"&&modoCfg)cerrarPerfil()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#perfil").hidden&&modoCfg)cerrarPerfil()});
$("#pform").addEventListener("submit",e=>{
  e.preventDefault();
  const err=m=>{$("#perr").textContent=m};
  const edad=+$("#pe").value,peso=leerPeso("rp"),alt=valCol($("#ra .rc"));
  if(!(edad>=10&&edad<=100))return err("La edad debe estar entre 10 y 100 años.");
  if(!(peso>=20&&peso<=300))return err("El peso debe estar entre 20 y 300 kg.");
  st.perfil={nombre:$("#pn").value.trim(),edad,peso,altura:alt,objetivo:$("#po").value,nivel:$("#pv").value};
  const ult=Object.keys(st.pesos).sort().pop();
  if(ult==null||st.pesos[ult]!==peso)st.pesos[hoyIso]=peso;
  st.perfilVisto=true;$("#perfil").hidden=true;pintar();
});
const IT=40;
const valCol=el=>+el.dataset.min+Math.round(el.scrollTop/IT);
function marcar(el,mudo){
  const v=valCol(el);
  if(el._v===v)return;
  el._v=v;el.setAttribute("aria-valuenow",v);
  const ant=el.querySelector(".it.on");if(ant)ant.classList.remove("on");
  const it=el.children[v-el.dataset.min];if(it)it.classList.add("on");
  if(!mudo){try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}}
}
function ponerCol(el,v,suave){
  v=Math.min(+el.dataset.max,Math.max(+el.dataset.min,v));
  el.scrollTo({top:(v-el.dataset.min)*IT,behavior:suave?"smooth":"auto"});
  if(!suave){el._v=null;marcar(el,true)}
}
function mkCol(el,min,max,label){
  el.classList.add("col");el.tabIndex=0;el.dataset.min=min;el.dataset.max=max;
  el.setAttribute("role","spinbutton");el.setAttribute("aria-label",label);
  el.setAttribute("aria-valuemin",min);el.setAttribute("aria-valuemax",max);
  el.innerHTML=Array.from({length:max-min+1},(_,i)=>`<div class="it">${min+i}</div>`).join("");
  let t;el.addEventListener("scroll",()=>{cancelAnimationFrame(t);t=requestAnimationFrame(()=>marcar(el))});
  el.addEventListener("click",e=>{const it=e.target.closest(".it");if(it)ponerCol(el,min+[...el.children].indexOf(it),true)});
  el.addEventListener("keydown",e=>{const d=e.key==="ArrowUp"?-1:e.key==="ArrowDown"?1:0;if(d){e.preventDefault();ponerCol(el,valCol(el)+d,true)}});
}
const ruedaPeso=id=>`<div class="rueda" id="${id}"><div class="rc"></div><span class="sep">,</span><div class="rc"></div><span class="un">kg</span><i class="banda"></i></div>`;
function armarPeso(id){const [i,d]=$("#"+id).querySelectorAll(".rc");mkCol(i,20,300,"Kilos");mkCol(d,0,9,"Decimales")}
function setPeso(id,v){const [i,d]=$("#"+id).querySelectorAll(".rc"),t=Math.round(v*10);ponerCol(i,Math.floor(t/10));ponerCol(d,t%10)}
function iniPeso(id,v){armarPeso(id);setPeso(id,v)}
const leerPeso=id=>{const [i,d]=$("#"+id).querySelectorAll(".rc");return valCol(i)+valCol(d)/10};
$("#rpw").innerHTML=ruedaPeso("rp");armarPeso("rp");
mkCol($("#ra .rc"),100,250,"Altura en centímetros");
function snap(k,e){
  const d=marks(k,e).filter(Boolean).length,o=st.hist[k]=st.hist[k]||{};
  if(d)o[e.id]={n:e.n,s:e.s,r:e.r,k:e.k,d};else delete o[e.id];
  if(!Object.keys(o).length)delete st.hist[k];
}
(function migrar(){
  for(const [k,o] of Object.entries(st.log))for(const [i,a] of Object.entries(o)){
    if(st.hist[k]&&st.hist[k][i])continue;
    const e=st.dias.flatMap(d=>d.ex).find(x=>x.id===i);if(!e)continue;
    const d=a.slice(0,e.s).filter(Boolean).length;
    if(d)(st.hist[k]=st.hist[k]||{})[i]={n:e.n,s:e.s,r:e.r,k:e.k,d};
  }
  if(st.perfil&&!Object.keys(st.pesos).length)st.pesos[hoyIso]=st.perfil.peso;
})();
const f1=v=>String(Math.round(v*10)/10).replace(".",",");
const fmtF=d=>`${d.slice(8)}/${d.slice(5,7)}/${d.slice(0,4)}`;
let evoEx=null;
function grafico(vals,labs,tipo){
  const W=300,H=140,pl=16,pr=16,pt=22,pb=22,n=vals.length,nn=vals.filter(v=>v!=null);
  if(!nn.length)return `<p class="tip" style="padding:8px">Aún no hay datos para mostrar.</p>`;
  let mn=tipo==="bar"?0:Math.min(...nn),mx=Math.max(...nn);
  if(tipo==="bar"){if(mx===0)mx=1}else{const q=(mx-mn)||1;mn-=q*.4;mx+=q*.4}
  const cx=i=>tipo==="bar"?pl+(W-pl-pr)/n*(i+.5):pl+i*(W-pl-pr)/Math.max(1,n-1);
  const Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let g=`<path d="M${pl} ${H-pb}H${W-pr}" style="stroke:var(--line);stroke-width:1.5;fill:none"/>`;
  const tx=(x,y,t,c)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="10" style="fill:var(--${c})">${t}</text>`;
  const pts=[];
  vals.forEach((v,i)=>{
    g+=tx(cx(i),H-6,labs[i],"mute");
    if(v==null)return;
    const x=cx(i),y=Y(v);pts.push([x,y]);
    if(tipo==="bar"){const bw=(W-pl-pr)/n*.55;g+=`<rect x="${x-bw/2}" y="${y}" width="${bw}" height="${H-pb-y}" rx="4" style="fill:var(--acc)"/>`+tx(x,y-5,f1(v),"ink")}
  });
  if(tipo!=="bar"){
    g+=`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("")}" style="stroke:var(--acc);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round"/>`;
    vals.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${cx(i)}" cy="${Y(v)}" r="3.5" style="fill:var(--acc)"/>`+tx(cx(i),Y(v)-8,f1(v),"ink")});
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolución">${g}</svg>`;
}
function renderEvo(){
  const ms=Array.from({length:6},(_,i)=>{const d=new Date(hoyD.getFullYear(),hoyD.getMonth()-(5-i),1);return{y:d.getFullYear(),m:d.getMonth(),k:`${d.getFullYear()}-${pad(d.getMonth()+1)}`}});
  const L=ms.map(x=>MESES[x.m].slice(0,3));
  const pv=ms.map(x=>{const f=Object.keys(st.pesos).filter(d=>d.startsWith(x.k)).sort().pop();return f?st.pesos[f]:null});
  const nums=pv.filter(v=>v!=null);
  let rp="Aún no hay registros de peso.";
  if(nums.length){const d=nums[nums.length-1]-nums[0];rp=`Actual: ${f1(nums[nums.length-1])} kg`+(nums.length>1?` · cambio de ${d>0?"+":""}${f1(d)} kg en el periodo`:"")}
  const ent=Object.entries(st.pesos).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,5);
  const ag=ms.map(x=>{let dias=0,ser=0,vol=0;for(const [dt,o] of Object.entries(st.hist)){if(!dt.startsWith(x.k))continue;const v=Object.values(o);if(v.length)dias++;v.forEach(h=>{ser+=h.d;vol+=h.d*h.r*h.k})}return{dias,ser,vol}});
  const nombres=[...new Set(Object.values(st.hist).flatMap(o=>Object.values(o).map(h=>h.n)))].sort((a,b)=>a.localeCompare(b,"es"));
  if(!evoEx||!nombres.includes(evoEx))evoEx=nombres[0]||null;
  let exH='<p class="tip">Marca series al entrenar y aquí verás cómo evoluciona cada ejercicio mes a mes.</p>';
  if(evoEx){
    const ev=ms.map(x=>{let mk=null,se=0;for(const [dt,o] of Object.entries(st.hist)){if(!dt.startsWith(x.k))continue;Object.values(o).forEach(h=>{if(h.n===evoEx){se+=h.d;mk=Math.max(mk??0,h.k)}})}return mk==null?null:{k:mk,se}});
    const kg=ev.some(v=>v&&v.k>0);
    exH=`<select id="evoSel" aria-label="Ejercicio">${nombres.map(n=>`<option ${n===evoEx?"selected":""}>${esc(n)}</option>`).join("")}</select>
    <div class="sub" style="margin-top:6px">${kg?"Mayor peso usado por mes (kg)":"Series completadas por mes (sin peso añadido)"}</div>
    <div class="gr">${grafico(ev.map(v=>v==null?null:(kg?v.k:v.se)),L,"line")}</div>`;
  }
  $("#evoc").innerHTML=`<div class="sec"><h3>Peso corporal</h3><div class="sub">${rp}</div><div class="gr">${grafico(pv,L,"line")}</div>
  <div class="sub" style="margin-top:10px">Peso de hoy (desliza)</div>${ruedaPeso("evoRp")}
  <button class="btn pri" id="evoReg" style="width:100%;margin-top:8px;padding:11px">Registrar peso de hoy</button>
  ${ent.length?`<table class="tb"><tr><th>Fecha</th><th>Peso</th></tr>${ent.map(([d,v])=>`<tr><td>${fmtF(d)}</td><td>${f1(v)} kg</td></tr>`).join("")}</table>`:""}</div>
  <div class="sec"><h3>Entrenamiento</h3><div class="sub">Series completadas por mes</div><div class="gr">${grafico(ag.map(a=>a.ser),L,"bar")}</div>
  <table class="tb"><tr><th>Mes</th><th>Días</th><th>Series</th><th>Volumen</th></tr>${ag.map((a,i)=>`<tr><td>${L[i]} ${ms[i].y}</td><td>${a.dias}</td><td>${a.ser}</td><td>${a.vol?Math.round(a.vol).toLocaleString("es")+" kg":"–"}</td></tr>`).reverse().join("")}</table></div>
  <div class="sec"><h3>Por ejercicio</h3>${exH}</div>`;
  iniPeso("evoRp",(st.perfil&&st.perfil.peso)||nums[nums.length-1]||70);
}
$("#evoBtn").addEventListener("click",()=>{$("#evo").hidden=false;renderEvo();$("#ecerrar").focus()});
$("#ecerrar").addEventListener("click",()=>{$("#evo").hidden=true});
$("#evo").addEventListener("click",e=>{
  if(e.target.id==="evo")$("#evo").hidden=true;
  if(e.target.id==="evoReg"){
    const v=leerPeso("evoRp");
    st.pesos[hoyIso]=v;if(st.perfil)st.perfil.peso=v;
    pintar();renderEvo();
  }
});
$("#evo").addEventListener("change",e=>{if(e.target.id==="evoSel"){evoEx=e.target.value;renderEvo()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#evo").hidden=true});
pintar();
if(!st.perfil&&!st.perfilVisto)abrirPerfil(false);
</script>
