<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi rutina de gym</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F1ED;--card:#FFFFFF;--ink:#1B1D21;--mute:#6B6E75;--line:#DDDBD4;--acc:#2B50F0;--accink:#fff;--ok:#E8B931;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171A;--card:#1E2125;--ink:#ECEBE6;--mute:#9A9DA4;--line:#2E3238;--acc:#6F8BFF;--accink:#10131A;--ok:#E8B931}}
:root[data-theme="dark"]{--bg:#15171A;--card:#1E2125;--ink:#ECEBE6;--mute:#9A9DA4;--line:#2E3238;--acc:#6F8BFF;--accink:#10131A;--ok:#E8B931}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;margin:0;letter-spacing:.01em}
h1{font-size:34px;line-height:1}
h2{font-size:28px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.sub{color:var(--mute);font-size:14px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.day{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 0 6px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;position:relative}
.day small{display:block;font:500 11px Barlow,sans-serif;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:clip;padding:0 2px;min-height:14px}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.day i{position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px;background:var(--ok);transform-origin:left;transform:scaleX(var(--p,0))}
.focusrow{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.focusrow select{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 16px}
.bar b{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.ex{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ex.done{border-color:var(--ok)}
.exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exname{font-weight:600;font-size:18px}
.meta{color:var(--mute);font-size:14px}
.x{border:0;background:none;color:var(--mute);font-size:22px;line-height:1;padding:2px 6px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.set{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:transparent;font:700 18px "Barlow Condensed",sans-serif}
.set[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#1B1D21}
.xs{display:flex;gap:2px}.ef .f{grid-template-columns:repeat(3,1fr)}.ef .row{display:flex;gap:8px;margin-top:12px}.ef .row .btn{flex:1;padding:10px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--mute);margin-bottom:10px}
form{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
form h3{margin:0 0 10px;font:700 20px "Barlow Condensed",sans-serif}
.f{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
label{display:block;font-size:13px;color:var(--mute)}
input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:3px}
.full{width:100%;margin-top:12px;padding:11px}
.tpl{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tpl .sub{width:100%}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Mi rutina</h1><div class="sub" id="resumen"></div></div>
    <button class="btn" id="tema" aria-label="Cambiar tema claro u oscuro">Tema</button>
  </header>

  <div class="week" id="semana" role="group" aria-label="Días de la semana"></div>

  <div class="focusrow">
    <h2 id="titulo"></h2>
  </div>
  <div class="focusrow">
    <select id="foco" aria-label="Enfoque del día"></select>
    <button class="btn" id="reset" title="Desmarcar series del día">Reiniciar día</button>
  </div>
  <div class="bar" aria-hidden="true"><b id="prog"></b></div>

  <div id="lista"></div>

  <form id="nuevo">
    <h3>Añadir ejercicio</h3>
    <label>Nombre
      <input id="n" list="biblio" required placeholder="Ej. Press de banca" autocomplete="off">
    </label>
    <datalist id="biblio"></datalist>
    <div class="f">
      <label>Series<input id="s" type="number" min="1" max="12" value="3" required></label>
      <label>Reps<input id="r" type="number" min="1" max="100" value="10" required></label>
      <label>Peso (kg)<input id="k" type="number" min="0" step="0.5" value="0"></label>
    </div>
    <button class="btn pri full" type="submit">Añadir al día</button>
  </form>

  <div class="tpl">
    <div class="sub">Empezar desde una plantilla (reemplaza la semana)</div>
    <button class="btn" data-t="ppl">Push / Pull / Pierna</button>
    <button class="btn" data-t="tp">Torso / Pierna</button>
    <button class="btn" data-t="fb">Cuerpo completo</button>
    <button class="btn" data-t="vacio">Vaciar semana</button>
  </div>
</main>

<script>
const DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const NOMBRES=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const FOCOS=["Sin definir","Descanso","Pecho","Espalda","Hombros","Brazos","Pierna","Push","Pull","Torso","Cuerpo completo","Cardio"];
const BIBLIO=["Press de banca","Press inclinado con mancuernas","Fondos","Aperturas","Dominadas","Remo con barra","Jalón al pecho","Remo con mancuerna","Press militar","Elevaciones laterales","Curl de bíceps","Extensión de tríceps","Sentadilla","Peso muerto rumano","Prensa","Zancadas","Curl femoral","Elevación de talones","Plancha","Hip thrust"];
const E=(n,s,r,k=0)=>({n,s,r,k});
const PUSH=[E("Press de banca",4,8),E("Press inclinado con mancuernas",3,10),E("Press militar",3,10),E("Elevaciones laterales",3,15),E("Extensión de tríceps",3,12)];
const PULL=[E("Dominadas",4,8),E("Remo con barra",4,8),E("Jalón al pecho",3,12),E("Curl de bíceps",3,12)];
const LEG=[E("Sentadilla",4,8),E("Peso muerto rumano",3,10),E("Prensa",3,12),E("Curl femoral",3,12),E("Elevación de talones",4,15)];
const TORSO=[E("Press de banca",4,8),E("Remo con barra",4,8),E("Press militar",3,10),E("Jalón al pecho",3,12),E("Curl de bíceps",2,12),E("Extensión de tríceps",2,12)];
const FULL=[E("Sentadilla",3,8),E("Press de banca",3,8),E("Remo con mancuerna",3,10),E("Press militar",3,10),E("Plancha",3,1)];
const PLANTILLAS={
 ppl:[["Push",PUSH],["Pull",PULL],["Pierna",LEG],["Descanso",[]],["Push",PUSH],["Pull",PULL],["Descanso",[]]],
 tp:[["Torso",TORSO],["Pierna",LEG],["Descanso",[]],["Torso",TORSO],["Pierna",LEG],["Descanso",[]],["Descanso",[]]],
 fb:[["Cuerpo completo",FULL],["Descanso",[]],["Cuerpo completo",FULL],["Descanso",[]],["Cuerpo completo",FULL],["Descanso",[]],["Descanso",[]]],
 vacio:[0,1,2,3,4,5,6].map(()=>["Sin definir",[]])
};
const KEY="rutina-gym-v1";
let id=0; const uid=()=>Date.now().toString(36)+(id++);
const hoy=(new Date().getDay()+6)%7;
let editId=null;
let st={sel:hoy,dias:DIAS.map(()=>({foco:"Sin definir",ex:[]}))};
try{const g=JSON.parse(localStorage.getItem(KEY)||"null");if(g&&g.dias&&g.dias.length===7)st=g;}catch(e){}
const guardar=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const prog=d=>{const t=d.ex.reduce((a,e)=>a+e.s,0);const h=d.ex.reduce((a,e)=>a+e.done.filter(Boolean).length,0);return t?h/t:0};

function pintar(){
  const dia=st.dias[st.sel];
  $("#semana").innerHTML=DIAS.map((n,i)=>{
    const d=st.dias[i];const f=d.foco==="Sin definir"?"":d.foco;
    return `<button class="day" data-i="${i}" aria-pressed="${i===st.sel}" aria-label="${NOMBRES[i]}${f?", "+f:""}">${n}<small>${esc(f)}</small><i style="--p:${prog(d)}"></i></button>`;
  }).join("");
  $("#titulo").textContent=NOMBRES[st.sel]+(st.sel===hoy?" · hoy":"");
  $("#foco").innerHTML=FOCOS.map(f=>`<option ${f===dia.foco?"selected":""}>${f}</option>`).join("");
  $("#prog").style.width=Math.round(prog(dia)*100)+"%";
  const L=$("#lista");
  if(!dia.ex.length){
    L.innerHTML=`<div class="empty">${dia.foco==="Descanso"?"Día de descanso. Recupera bien.":"Aún no hay ejercicios este día. Añade uno abajo o carga una plantilla."}</div>`;
  } else {
    L.innerHTML=dia.ex.map(e=>{
      if(e.id===editId)return `<form class="ex ef" data-edit="${e.id}">
        <label>Nombre<input name="n" list="biblio" required value="${esc(e.n)}" autocomplete="off"></label>
        <div class="f">
          <label>Series<input name="s" type="number" min="1" max="12" required value="${e.s}"></label>
          <label>Reps<input name="r" type="number" min="1" max="100" required value="${e.r}"></label>
          <label>Peso (kg)<input name="k" type="number" min="0" step="0.5" value="${e.k}"></label>
        </div>
        <div class="row"><button type="button" class="btn" data-cancel>Cancelar</button><button type="submit" class="btn pri">Guardar</button></div>
      </form>`;
      const fin=e.done.filter(Boolean).length===e.s;
      return `<div class="ex ${fin?"done":""}" data-id="${e.id}">
        <div class="exhead"><div><div class="exname">${esc(e.n)}</div><div class="meta">${e.s} × ${e.r}${e.k?` · ${e.k} kg`:""}</div></div>
        <div class="xs"><button class="x" data-edit-btn="${e.id}" aria-label="Editar ${esc(e.n)}">✎</button><button class="x" data-del="${e.id}" aria-label="Quitar ${esc(e.n)}">×</button></div></div>
        <div class="sets">${e.done.map((v,j)=>`<button class="set" data-id="${e.id}" data-j="${j}" aria-pressed="${v}" aria-label="Serie ${j+1} de ${e.s}">${j+1}</button>`).join("")}</div>
      </div>`;
    }).join("");
  }
  const tot=st.dias.filter(d=>d.ex.length).length;
  $("#resumen").textContent=tot?`${tot} ${tot===1?"día":"días"} de entrenamiento esta semana`:"Planifica tu semana de entrenamiento";
  guardar();
}

$("#semana").addEventListener("click",e=>{const b=e.target.closest(".day");if(b){st.sel=+b.dataset.i;editId=null;pintar()}});
$("#foco").addEventListener("change",e=>{st.dias[st.sel].foco=e.target.value;pintar()});
$("#reset").addEventListener("click",()=>{st.dias[st.sel].ex.forEach(x=>x.done=x.done.map(()=>false));pintar()});
$("#lista").addEventListener("click",e=>{
  const dia=st.dias[st.sel];
  const ed=e.target.closest("[data-edit-btn]");
  if(ed){editId=ed.dataset.editBtn;pintar();const i=document.querySelector(".ef input");if(i)i.focus();return}
  if(e.target.closest("[data-cancel]")){editId=null;pintar();return}
  const del=e.target.closest("[data-del]");
  if(del){dia.ex=dia.ex.filter(x=>x.id!==del.dataset.del);pintar();return}
  const s=e.target.closest(".set");
  if(s){const x=dia.ex.find(x=>x.id===s.dataset.id);x.done[+s.dataset.j]=!x.done[+s.dataset.j];pintar()}
});
$("#lista").addEventListener("submit",e=>{
  const f=e.target.closest("[data-edit]");if(!f)return;
  e.preventDefault();
  const x=st.dias[st.sel].ex.find(x=>x.id===f.dataset.edit);if(!x)return;
  const n=f.n.value.trim();if(!n)return;
  const s=Math.max(1,Math.min(12,+f.s.value||x.s));
  x.n=n;x.r=+f.r.value||x.r;x.k=+f.k.value||0;
  x.done=Array.from({length:s},(_,i)=>!!x.done[i]);x.s=s;
  editId=null;pintar();
});
$("#nuevo").addEventListener("submit",e=>{
  e.preventDefault();
  const n=$("#n").value.trim();if(!n)return;
  const s=Math.max(1,Math.min(12,+$("#s").value||3));
  const dia=st.dias[st.sel];
  dia.ex.push({id:uid(),n,s,r:+$("#r").value||10,k:+$("#k").value||0,done:Array(s).fill(false)});
  if(dia.foco==="Sin definir")dia.foco="Cuerpo completo";
  $("#n").value="";pintar();
});
document.querySelector(".tpl").addEventListener("click",e=>{
  const b=e.target.closest("[data-t]");if(!b)return;
  if(st.dias.some(d=>d.ex.length)&&!confirm("Esto reemplazará tu semana actual. ¿Continuar?"))return;
  st.dias=PLANTILLAS[b.dataset.t].map(([foco,ex])=>({foco,ex:ex.map(x=>({id:uid(),n:x.n,s:x.s,r:x.r,k:x.k,done:Array(x.s).fill(false)}))}));
  pintar();
});
$("#tema").addEventListener("click",()=>{
  const r=document.documentElement;
  const osDark=matchMedia("(prefers-color-scheme: dark)").matches;
  const actual=r.dataset.theme||(osDark?"dark":"light");
  r.dataset.theme=actual==="dark"?"light":"dark";
});
$("#biblio").innerHTML=BIBLIO.map(b=>`<option value="${b}">`).join("");
pintar();
</script>
</body>
</html>
